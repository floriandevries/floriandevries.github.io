name: Lookback

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: lookback
  cancel-in-progress: false

jobs:
  lookback:
    if: github.event_name == 'schedule' || github.actor == 'fjdev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - id: summary
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          gh label create lookback --color FBCA04 --description "Monthly look-back review" --force
          {
            gh issue list --label idea --state open --limit 200 --json number,title
            gh issue list --label this-week --state open --limit 200 --json number,title
            gh pr list --state open --limit 200 --json number,title
          } | jq -s 'add' > open.json
          summary=$(python -m fjdev.lookback < open.json)
          echo "json=$summary" >> "$GITHUB_OUTPUT"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lookback.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record look-back"
            git push origin HEAD:main
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow prompts/lookback.md in ${{ github.repository }}.
            The summary is: ${{ steps.summary.outputs.json }}
          claude_args: |
            --max-turns 10
            --permission-mode acceptEdits
            --allowedTools "Bash(gh issue create:*),Bash(gh issue list:*),Read"
      - if: failure()
        uses: ./.github/actions/report-failure
