name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [closed]
    paths: ['content/**']

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && github.actor == 'fjdev'
      && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: "claude/"
          claude_args: |
            --max-turns 10
            --append-system-prompt "Follow CLAUDE.md. When asked to draft, follow prompts/draft.md exactly."
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(hugo new:*),Bash(PYTHONPATH=scripts python -m fjdev.content_check:*),Bash(gh pr create:*),Bash(gh issue comment:*)"

  followup:
    if: >-
      github.event_name == 'issues'
      && github.actor == 'fjdev'
      && contains(github.event.issue.labels.*.name, 'idea')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Follow prompts/followup.md for issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Read the issue with gh issue view and reply with gh issue comment.
          claude_args: |
            --max-turns 10
            --allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Read"

  linkedin:
    if: >-
      github.event_name == 'pull_request'
      && github.actor == 'fjdev'
      && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Follow prompts/linkedin.md for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read it with gh pr view and gh pr diff, then post the result with gh pr comment.
          claude_args: |
            --max-turns 10
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read"
