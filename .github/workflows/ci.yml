name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest
